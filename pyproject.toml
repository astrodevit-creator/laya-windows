[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laya-windows"
version = "0.1.0"
description = "Laya typed decisions (choice / score / yes-no) on Windows via PyTorch; port of laya-coreml"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = ["torch>=2.5", "numpy>=1.26", "tokenizers>=0.21,<1", "huggingface-hub>=0.34", "safetensors>=0.6"]

[project.scripts]
laya = "laya_windows.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["laya_windows"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
